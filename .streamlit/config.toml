[theme]
base = "light"
primaryColor = "#E77C25"
backgroundColor = "#F4F2EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182831"
font = "sans serif"

[server]
headless = true
# Serves static/ at /app/static: the panels page's self-hosted fonts (SIL OFL).
enableStaticServing = true

[browser]
gatherUsageStats = false
